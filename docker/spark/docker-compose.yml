networks:
  default:
    name: de-platform

services:
  spark-master:
    build: .
    image: de-platform/spark:local
    environment:
      SPARK_MODE: master
    ports:
      - "7077:7077"
      - "8081:8080" # Spark master UI (8080 is taken by Airflow webserver)
    volumes:
      - ../../spark_jobs:/opt/spark_jobs

  spark-worker:
    build: .
    image: de-platform/spark:local
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      # 4 cores: 2 for the always-on spark-streaming app (spark.cores.max=2), 2 for batch jobs
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 4G
    depends_on:
      - spark-master
    volumes:
      - ../../spark_jobs:/opt/spark_jobs

  # Long-lived Structured Streaming app (spark_jobs/streaming/run_all.py): Kafka ->
  # MinIO raw parquet (STREAM_RAW_ROOT) + ClickHouse dwh.<fact>_streaming. The driver
  # runs in this container; executors run on spark-worker. Needs kafka + minio
  # (raw data + checkpoints) up. Restarts itself if a query dies.
  spark-streaming:
    image: de-platform/spark:local
    depends_on:
      - spark-master
      - spark-worker
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      STREAM_CHECKPOINT_ROOT: s3a://${MINIO_BUCKET_PROCESSED}/checkpoints/streaming
      STREAM_RAW_ROOT: s3a://${MINIO_BUCKET_RAW}/logistics
      STREAM_TRIGGER: 30 seconds
      DWH_CH_URL: ${DWH_CH_URL}
      DWH_CH_USER: ${DWH_CH_USER}
      DWH_CH_PASSWORD: ${DWH_CH_PASSWORD}
      DWH_TARGET_DB: ${DWH_TARGET_DB}
      DWH_RAW_HISTORY_ROOT: s3a://${MINIO_BUCKET_RAW}/history   # lookups (routes) for fact_trip
    command:
      - spark-submit
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.driver.host=spark-streaming
      - --conf
      - spark.cores.max=2
      - --conf
      - spark.executor.memory=1g
      - --conf
      - spark.sql.shuffle.partitions=4
      - --conf
      - spark.hadoop.fs.s3a.endpoint=${MINIO_ENDPOINT}
      - --conf
      - spark.hadoop.fs.s3a.path.style.access=true
      - --conf
      - spark.hadoop.fs.s3a.access.key=${MINIO_ROOT_USER}
      - --conf
      - spark.hadoop.fs.s3a.secret.key=${MINIO_ROOT_PASSWORD}
      - /opt/spark_jobs/streaming/run_all.py
    volumes:
      - ../../spark_jobs:/opt/spark_jobs
    restart: unless-stopped
